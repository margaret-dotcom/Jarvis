# Jarvis cron jobs. install.sh reads this file and registers each job with
# `hermes cron create`. Edit here, rerun install.sh, and it adds anything new
# by name. To change an existing job, remove it (hermes cron remove <id>) and
# rerun, or edit it in place with hermes cron edit.
#
# Schedules are 5-field cron expressions. Hermes anchors them to the timezone
# in its config.yaml, which install.sh sets from JARVIS_TZ in .env.
# workdir: $JARVIS_HOME is replaced with the value from .env at install time.
# Every job loads jarvis-core first, then its own skill.

defaults:
  deliver: telegram
  workdir: $JARVIS_HOME

jobs:
  - name: morning-brief-weekday
    schedule: "0 6 * * 1-5"
    skills: [jarvis-core, morning-brief]
    prompt: >
      Run the morning brief for today. Refresh the data, classify the day,
      save the headline and day shape into today.json, publish it, and
      deliver the brief as your final message.

  - name: morning-brief-weekend
    schedule: "30 7 * * 0,6"
    skills: [jarvis-core, morning-brief]
    prompt: >
      Run the weekend morning brief. Refresh the data, classify the day,
      save the headline and day shape into today.json, publish it, and
      deliver the brief as your final message. Keep it shorter than a
      weekday brief when the calendar is quiet.

  - name: evening-summary
    schedule: "0 19 * * *"
    skills: [jarvis-core, evening-summary, brain-ingest]
    prompt: >
      Run the evening summary. Refresh the data, compare the day against this
      morning's brief, write the yesterday block and any goal updates into
      today.json, file the brain inbox and the day's decisions, publish, and
      deliver the summary with the goal questions and the four review prompts.

  - name: dashboard-refresh
    schedule: "0 8-18 * * 1-5"
    skills: [jarvis-core, dashboard-refresh]
    prompt: >
      Refresh the dashboard data. Run the collectors, validate today.json,
      publish if it changed. Reply [SILENT] unless a source is in error or
      the publish failed.

  - name: content-scout
    schedule: "0 12 * * 1,3,5"
    skills: [jarvis-core, content-scout]
    prompt: >
      Run the content scout for both audiences. Gather candidates from the last
      14 days, score them, write up to five recommendations into today.json,
      file the top two in the brain, publish, and deliver the top three.

  - name: brain-ingest-sweep
    schedule: "0 21 * * *"
    skills: [jarvis-core, brain-ingest]
    prompt: >
      Run the 9 PM brain sweep. File everything left in brain/inbox, commit and
      push the library. Reply [SILENT] if nothing was filed and nothing failed.

  - name: weekly-review
    schedule: "0 17 * * 0"
    skills: [jarvis-core, weekly-review]
    prompt: >
      Run the weekly review for the week ending today. Read the evening
      summaries, daily reviews, dashboard history, goals, and this week's brain
      notes. Write the review into brain/library/decisions, commit and push it,
      and deliver it.
